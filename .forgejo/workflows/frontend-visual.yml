name: frontend-visual-regression

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".forgejo/workflows/frontend-visual.yml"
  workflow_dispatch:

jobs:
  visual-regression:
    # ⚠ **自前の台で回す**（forge へ移したとき変えた）。
    runs-on: [self-hosted, nolumialab]
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        # node-version は書かない（setup-node は先に api.github.com の一覧を引く）。
        # 台の像（node:24-bookworm）の Node 24 をそのまま使う（2026-10-01、task #174）。
        with:
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox

      - name: Run frontend quality gate
        run: npm run test:ci

      - name: Check if snapshots exist
        id: check_snapshots
        run: |
          if find e2e/specs -type d -name "*-snapshots" -exec find {} -name "*.png" \; 2>/dev/null | grep -q .; then
            echo "exist=true" >> "$GITHUB_OUTPUT"
          else
            echo "exist=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No baseline snapshots found (baselines are kept outside git; see frontend/.gitignore)."
          fi

      - name: Run visual regression
        if: steps.check_snapshots.outputs.exist == 'true'
        run: npm run test:e2e:ci

  # ⚠ **基準画像を撮ってコミットする段（update-snapshots）は消した**（2026-10-01、task #174）。
  #   github.com へ押していて forge では必ず落ちるうえ、frontend/.gitignore が `*.png` を
  #   外している（「基準画像は git の外で持つ」という決め）ので、押せても何も載らなかった。

  mobile-regression:
    # ⚠ **自前の台で回す**（forge へ移したとき変えた）。
    runs-on: [self-hosted, nolumialab]
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        # node-version は書かない（setup-node は先に api.github.com の一覧を引く）。
        # 台の像（node:24-bookworm）の Node 24 をそのまま使う（2026-10-01、task #174）。
        with:
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run mobile regression flow
        run: npm run test:mobile:regression
